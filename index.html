<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Parallel Stream Monitor</title>
    <script src="./AgoraRTC_N-4.24.6.js"></script>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; background: #000; color: #fff; margin: 0; padding: 10px; }
        h2, h4 { text-align: center; }
        .grid { display: flex; gap: 20px; justify-content: center; margin-top: 20px; }
        .player-card { background: #1a1a1a; border-radius: 6px; padding: 10px; width: 45%; }
        .video-viewport { width: 100%; height: 360px; background: #282828; border-radius: 4px; overflow: hidden; }
        .video-viewport video { transform: scaleX(-1) !important; }
    </style>
</head>
<body>

    <h2>Parallel Stream Monitor</h2>

    <div class="grid">
        <div class="player-card">
            <h4>A: Feed equipped with Yolo26n</h4>
            <div id="stream-1-player" class="video-viewport"></div>
        </div>
        <div class="player-card">
            <h4>B: Feed seen through GoogleCardboard</h4>
            <div id="stream-2-player" class="video-viewport"></div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const appIdA = '1e57bfb22ec94e7da2f6c8d0ebb94628';
        const appIdB = '56ced53c4bc84bb8b3482df30facb529';
        const tokenA = urlParams.get('tokenA')?.trim();
        const tokenB = urlParams.get('tokenB')?.trim();

        // Debug output: Check exact parsed values directly in browser console
        console.log("[Debug] appIdA:", appIdA);
        console.log("[Debug] appIdB:", appIdB);
        console.log("[Debug] tokenA loaded:", Boolean(tokenA));
        console.log("[Debug] tokenB loaded:", Boolean(tokenB));

        // Validate parameters
        const isAppIdAValid = appIdA && appIdA.length === 32;
        const isAppIdBValid = appIdB && appIdB.length === 32;
        const areTokensPresent = Boolean(tokenA) && Boolean(tokenB);
        
        const channelName = "AR_VR_Workspace";
                
        const clientA = AgoraRTC.createClient({ mode: "live", codec: "h264", autoSubscribeAudio: false });
        const clientB = AgoraRTC.createClient({ mode: "live", codec: "h264", autoSubscribeAudio: false });

        // Stream 1 Listener (Handles UID on Project A)
        clientA.on("user-published", async (user, mediaType) => {
            console.log("[Project A] User published:", user.uid, mediaType);
            if (mediaType === "video") { 
                await clientA.subscribe(user, mediaType);
                user.videoTrack.play("stream-1-player", { mirror: false });
                console.log("[Project A] Stream 1 playing!");
                }
        });

        // Stream 2 Listener (Handles UID on Project B)
        clientB.on("user-published", async (user, mediaType) => {
            console.log("[Project B] User published:", user.uid, mediaType);
            if (mediaType === "video") {
                await clientB.subscribe(user, mediaType);
                user.videoTrack.play("stream-2-player", { mirror: false });
                console.log("[Project B] Stream 2 playing!");
                }
        });

        clientA.on("user-unpublished", (user, mediaType) => {
            if (mediaType === "video") {
                console.log("[Project A] Stream 1 stopped/unpublished");
                }
        });

        clientB.on("user-unpublished", (user, mediaType) => {
            if (mediaType === "video") {
                console.log("[Project B] Stream 2 stopped/unpublished");
                }
        });
        
        async function startMonitor() {
            if (!isAppIdAValid) {
                console.error("[Abort] appIdA is missing or not 32 characters long:", appIdA);
                return;
            }
            if (!isAppIdBValid) {
                console.error("[Abort] appIdB is missing or not 32 characters long:", appIdB);
                return;
            }
            if (!areTokensPresent) {
                console.error("[Abort] Missing tokenA or tokenB in URL query parameters.");
                return;
            }
            try {
                await clientA.setClientRole("audience");
                await clientB.setClientRole("audience");
               
                // Web Client A joins Project A
                await clientA.join(appIdA, channelName, tokenA, null);
                console.log("[Project A] Web Receiver Connected");

                // Web Client B joins Project B
                await clientB.join(appIdB, channelName, tokenB, null);
                console.log("[Project B] Web Receiver Connected");
            } catch (err) {
                console.error("[Agora Web Receiver Error]", err);
            }
        }
    startMonitor();
    </script>
</body>
</html>
